<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGR</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- core Three.js & Loaders -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
        <!-- เพิ่มสคริปต์ fflate บรรทัดนี้ ก่อนหน้า EXRLoader -->
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.0/umd/index.min.js"></script>
    
    <!-- lil-gui library สำหรับสร้างเมนูควบคุม GUI -->
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>

    <script>
        // 1. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // เพิ่มความสมจริงของแสง PBR
        document.body.appendChild(renderer.domElement);

        // 2. Scene & Camera Setup
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 3, 7);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 3. Lights Setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 8, 5);
        directionalLight.castShadow = true;

        // --- แก้ไข/เพิ่มการกำหนดขอบเขตกล้องรับเงาตรงนี้ ---
        const d = 10; // ขยายขอบเขตกว้าง-ยาว 10 หน่วย (ครอบคลุมพื้นขนาด 15x15)
        directionalLight.shadow.camera.left = -d;
        directionalLight.shadow.camera.right = d;
        directionalLight.shadow.camera.top = d;
        directionalLight.shadow.camera.bottom = -d;
        directionalLight.shadow.camera.near = 0.1;
        directionalLight.shadow.camera.far = 25;

        // ความละเอียดเงา
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.bias = -0.0005; // ช่วยลดรอยหยัก/เงาขาดที่พื้นผิว

        scene.add(directionalLight);

        // --- เพิ่มส่วนนี้: สร้างก้อนวัตถุบอกตำแหน่งไฟ (Light Indicator Mesh) ---
        const lightGeo = new THREE.SphereGeometry(0.3, 16, 16); // ขนาดทรงกลม
        const lightMat = new THREE.MeshBasicMaterial({ color: 0xffea00 }); // สีเหลืองเรืองแสง (ไม่ขึ้นกับแสงอื่น)
        const lightMesh = new THREE.Mesh(lightGeo, lightMat);
            
        // ผูก lightMesh ไว้กับ directionalLight เพื่อให้ย้ายตำแหน่งตามกันอัตโนมัติ
        directionalLight.add(lightMesh);

        // (Optional) หากต้องการเปิดดูขอบเขตกล่องคำนวณเงา ให้เปิดบรรทัดนี้:
        // const shadowHelper = new THREE.CameraHelper(directionalLight.shadow.camera);
        // scene.add(shadowHelper);

        // 4. Environment Map (EXR Skybox)
        const exrSkyboxUrl = 'https://watcharapong1451.github.io/goegap_road_2k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

        // 5. Floor (พื้น)
        const textureLoader = new THREE.TextureLoader();
        const texFloor = textureLoader.load('https://watcharapong1451.github.io/pebbles_diff_1k.jpg', (tex) => {
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        //tex.repeat.set(6, 6); // ปรับเพิ่ม/ลดเพื่อความสมส่วนของลายพื้น
    });
        
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            color: new THREE.Color(0x555555), 
            envMapIntensity: 0.3,
            side: THREE.DoubleSide,
            roughness: 0.9,
            metalness: 0.1
        });

        const planeGeometry = new THREE.PlaneGeometry(15, 15);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        plane.position.y = 0; // ปรับตำแหน่ง Y ของพื้นให้ต่ำลงเล็กน้อย
        scene.add(plane);

        // 5.2 Building / Structure (แผงกั้นถนนโลหะ PBR 2 ฝั่ง - Double Metallic Guardrails)
    function createGuardrail(zPos, bulgeDirection) {
    const group = new THREE.Group();

    const matGuardrail = new THREE.MeshStandardMaterial({
        color: 0xdcdcdc,
        metalness: 0.95,
        roughness: 0.25,
        envMapIntensity: 1.2
    });

    // สร้างลอน W-Beam (bulgeDirection: +1 หันลอนเข้าหา +Z, -1 หันลอนเข้าหา -Z)
    const railShape = new THREE.Shape();
    const d = -0.03 * bulgeDirection;
    railShape.moveTo(0, 0);
    railShape.lineTo(d, 0.05);
    railShape.lineTo(d, 0.12);
    railShape.lineTo(0, 0.17);
    railShape.lineTo(d, 0.22);
    railShape.lineTo(d, 0.29);
    railShape.lineTo(0, 0.34);

    const extrudeSettings = { steps: 1, depth: 15, bevelEnabled: false };
    const railGeo = new THREE.ExtrudeGeometry(railShape, extrudeSettings);
    const railMesh = new THREE.Mesh(railGeo, matGuardrail);

    railMesh.rotation.y = Math.PI / 2;
    railMesh.position.set(-7.5, 0.3, zPos);
    railMesh.castShadow = true;
    railMesh.receiveShadow = true;
    group.add(railMesh);

    // สร้างเสาค้ำไว้ด้านหลังของแผงกั้น
    const postOffset = -0.07 * bulgeDirection;
    const postGeo = new THREE.BoxGeometry(0.1, 0.7, 0.1);
    for (let x = -7; x <= 7; x += 2.5) {
        const post = new THREE.Mesh(postGeo, matGuardrail);
        post.position.set(x, 0.35, zPos + postOffset);
        post.castShadow = true;
        post.receiveShadow = true;
        group.add(post);
    }

    scene.add(group);
}

    // สร้างแผงกั้น 2 ฝั่ง (ขยับห่างออกไปที่ Z = -6.5 และ Z = +6.5)
    createGuardrail(-6.5, 1);  // ฝั่งด้านหลัง
    createGuardrail(6.5, -1);  // ฝั่งด้านหน้า

        // 6. GUI Instance Initial
        const gui = new lil.GUI({ title: 'PBR & Light Controls' });

        // GUI ควบคุมตำแหน่งแสง (ข้อกำหนดจำเป็นของอาจารย์)
        const lightFolder = gui.addFolder('Directional Light Position');
        lightFolder.add(directionalLight.position, 'x', -15, 15, 0.1).name('Light X')//.onChange(() => lightHelper.update());
        lightFolder.add(directionalLight.position, 'y', 1, 20, 0.1).name('Light Y')//.onChange(() => lightHelper.update());
        lightFolder.add(directionalLight.position, 'z', -15, 15, 0.1).name('Light Z')//.onChange(() => lightHelper.update());
        lightFolder.add(directionalLight, 'intensity', 0, 5, 0.1).name('Light Intensity');

        // 7. Load Car Model & Bind PBR Controls strictly to the Car
        const carMaterials = []; // เก็บ Material ทั้งหมดของตัวรถ

        const loader = new THREE.GLTFLoader();
        loader.load('https://watcharapong1451.github.io/car.glb', (gltf) => {
            const carModel = gltf.scene;

            carModel.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;

                    // ดึง Material ของรถออกมาเก็บไว้
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            carMaterials.push(...child.material);
                        } else {
                            carMaterials.push(child.material);
                        }
                    }
                }
            });

            carModel.position.set(0, 0, 0);
            carModel.scale.set(2, 2, 2);
            carModel.rotation.y = 1; 
            scene.add(carModel);

            // เมื่อรถโหลดเสร็จแล้ว ให้เพิ่มแถบปรับ PBR ของรถใน GUI
            if (carMaterials.length > 0) {
                const carFolder = gui.addFolder('Car PBR Attributes');

                // ค่าเริ่มต้นสำหรับตั้งค่าผ่าน GUI
                const carSettings = {
                    baseColor: '#' + (carMaterials[0].color ? carMaterials[0].color.getHexString() : 'ffffff'),
                    metallic: carMaterials[0].metalness !== undefined ? carMaterials[0].metalness : 0.8,
                    roughness: carMaterials[0].roughness !== undefined ? carMaterials[0].roughness : 0.2
                };

                // 1. Base Color ของรถ
                carFolder.addColor(carSettings, 'baseColor').name('Base Color').onChange((value) => {
                    carMaterials.forEach(mat => {
                        if (mat.color) mat.color.set(value);
                    });
                });

                // 2. Metallic (ความเป็นโลหะ) ของรถ
                carFolder.add(carSettings, 'metallic', 0, 1, 0.01).name('Metallic').onChange((value) => {
                    carMaterials.forEach(mat => {
                        if ('metalness' in mat) mat.metalness = value;
                    });
                });

                // 3. Roughness (ความขรุขระ/เงา) ของรถ
                carFolder.add(carSettings, 'roughness', 0, 1, 0.01).name('Roughness').onChange((value) => {
                    carMaterials.forEach(mat => {
                        if ('roughness' in mat) mat.roughness = value;
                    });
                });

                carFolder.open();
            }
        });

        // 8. Animation & Render Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 9. Window Resize Event
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
