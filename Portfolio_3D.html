<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Portfolio</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #ui-hint {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="ui-hint">💡 คลิกที่ผลงานเพื่อซูมเข้าไปดูใกล้ๆ (คลิกพื้นที่ว่างเพื่อถอยกล้องกลับ)</div>

    <!-- Core Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.18.1/meshopt_decoder.js"></script>

    <script>
        // =======================================================
        // 1. SCENE & RENDERER SETUP
        // =======================================================
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 6, 12);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // หยุดการ Lerp กล้องทันทีเมื่อผู้ใช้หมุนกล้องเอง
        let isLerping = false;
        controls.addEventListener('start', () => {
            isLerping = false;
        });

        // LIGHTING SETUP
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(5, 12, 8);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x88bbff, 0.4);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        // =======================================================
        // 2. SHADER MODIFIERS (onBeforeCompile Preserves PBR/Textures)
        // =======================================================
        const uniforms = { uTime: { value: 0 } };

        // ปรับแต่ง Shader ของผ้าคลุม (ไม่ทับ Texture เดิม)
        function applyBannerAnimation(material) {
            material.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = uniforms.uTime;
                shader.vertexShader = `
                    uniform float uTime;
                    ` + shader.vertexShader;
                shader.vertexShader = shader.vertexShader.replace(
                    '#include <begin_vertex>',
                    `
                    #include <begin_vertex>
                    float wave = sin(position.x * 3.5 + uTime * 2.5) * 0.06;
                    float wave2 = cos(position.y * 2.5 + uTime * 2.0) * 0.04;
                    transformed.z += wave + wave2;
                    `
                );
            };
        }

        // ปรับแต่ง Shader ของใบไม้ (ไม่ทับ Texture เดิม)
        function applyLeafAnimation(material) {
            material.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = uniforms.uTime;
                shader.vertexShader = `
                    uniform float uTime;
                    ` + shader.vertexShader;
                shader.vertexShader = shader.vertexShader.replace(
                    '#include <begin_vertex>',
                    `
                    #include <begin_vertex>
                    float wind = sin(uTime * 2.8 + position.x * 4.0 + position.z * 4.0) * 0.05 * max(0.0, position.y);
                    transformed.x += wind;
                    transformed.z += wind * 0.6;
                    `
                );
            };
        }

        // =======================================================
        // 3. GLB MODEL LOADING & OBJECT BINDING
        // =======================================================
        const interactiveObjects = [];
        const defaultCamPos = new THREE.Vector3(0, 6, 12);
        const defaultTarget = new THREE.Vector3(0, 0, 0);

        const targetCamPos = new THREE.Vector3().copy(defaultCamPos);
        const targetLookAt = new THREE.Vector3().copy(defaultTarget);

        MeshoptDecoder.ready.then(() => {
            const gltfLoader = new THREE.GLTFLoader();
            gltfLoader.setMeshoptDecoder(MeshoptDecoder);

            const glbUrl = 'https://watcharapong1451.github.io/Portfolio_3D.glb';

            gltfLoader.load(
                glbUrl,
                (gltf) => {
                    const model = gltf.scene;

                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;

                            if (child.material && child.material.map) {
                                child.material.map.encoding = THREE.sRGBEncoding;
                            }

                            const name = child.name.toLowerCase();

                            // ฉีดแอนิเมชันใส่ Material เดิมเพื่อคงแสงเงาและ Texture ไว้
                            if (name.includes('leaf') || name.includes('leaves') || name.includes('plant') || name.includes('tree') || name.includes('ใบไม้')) {
                                applyLeafAnimation(child.material);
                            }

                            if (name.includes('banner') || name.includes('cloth') || name.includes('ribbon') || name.includes('red') || name.includes('ผ้า')) {
                                applyBannerAnimation(child.material);
                            }

                            // Bind ผลงานสำหรับ Raycaster Picking
                            if (name.includes('project') || name.includes('item') || name.includes('work') || name.includes('mascot') || name.includes('pedestal') || name.includes('cube')) {
                                interactiveObjects.push(child);
                            }
                        }
                    });

                    scene.add(model);

                    // จัดตำแหน่งกลางโมเดลและเซ็ตระยะกล้องเริ่มต้น
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    model.position.sub(center); // จัดจุดศูนย์กลางโมเดลให้อยู่ที่ (0,0,0)

                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2.2;

                    defaultCamPos.set(0, maxDim * 0.7, cameraZ);
                    defaultTarget.set(0, 0, 0);

                    targetCamPos.copy(defaultCamPos);
                    targetLookAt.copy(defaultTarget);

                    camera.position.copy(defaultCamPos);
                    controls.target.copy(defaultTarget);
                    controls.update();
                },
                undefined,
                (error) => console.error('Error loading GLB:', error)
            );
        });

        // =======================================================
        // 4. RAYCASTER PICKING & INTERACTION LOGIC
        // =======================================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let pointerDownPos = { x: 0, y: 0 };

        window.addEventListener('pointerdown', (e) => {
            pointerDownPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            // ถ้าระยะลากเมาส์เกิน 5px ถือว่าเป็นการหมุนมุมมอง ไม่ใช่การคลิก
            const moveDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            if (moveDist > 5) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects, true);

            if (intersects.length > 0) {
                // คลิกโดนวัตถุ -> กำหนดเป้าหมายซูมกล้องเข้าใกล้
                const clickedObj = intersects[0].object;
                const worldPos = new THREE.Vector3();
                clickedObj.getWorldPosition(worldPos);

                targetLookAt.copy(worldPos);
                const offset = new THREE.Vector3(0, 1.2, 3.2);
                targetCamPos.copy(worldPos).add(offset);
            } else {
                // คลิกพื้นที่ว่าง -> ถอยกล้องกลับมุมมองเริ่มต้น
                targetLookAt.copy(defaultTarget);
                targetCamPos.copy(defaultCamPos);
            }

            isLerping = true; // เปิดใช้งานการเคลื่อนที่ของกล้อง
        });

        // =======================================================
        // 5. ANIMATION LOOP
        // =======================================================
        function animate(time) {
            requestAnimationFrame(animate);

            // อัปเดตเวลาส่งให้ Vertex Shader
            uniforms.uTime.value = time * 0.001;

            // ขยับกล้องนุ่มนวลเฉพาะเมื่อมีการสั่งซูม (ไม่สู้มือตอนลาก OrbitControls)
            if (isLerping) {
                camera.position.lerp(targetCamPos, 0.05);
                controls.target.lerp(targetLookAt, 0.05);

                // เมื่อกล้องเข้าใกล้จุดเป้าหมายมากพอ ให้ปิดการ Lerp เพื่อคืนการควบคุม
                if (camera.position.distanceTo(targetCamPos) < 0.01 && controls.target.distanceTo(targetLookAt) < 0.01) {
                    isLerping = false;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Responsive Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
