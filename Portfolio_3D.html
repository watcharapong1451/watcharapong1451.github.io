<!DOCTYPE html>
<html>

<head>
    <title>Interactive 3D Portfolio</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script>
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        
        // กำหนดตำแหน่งเริ่มต้นของกล้องและจุดโฟกัส
        const defaultCamPos = new THREE.Vector3(0, 6, 12);
        const defaultLookAt = new THREE.Vector3(0, 3, 0);
        
        camera.position.copy(defaultCamPos);
        

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.copy(defaultLookAt);
        controls.update();

        // ทำให้กล้องไม่หยุดทันที
        let isLerping = false;
        let targetCamPos = new THREE.Vector3().copy(defaultCamPos);
        let targetLookAt = new THREE.Vector3().copy(defaultLookAt);

        controls.addEventListener('start', () => {
            isLerping = false;
        });

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const direcLight = new THREE.DirectionalLight(0xffffff, 0.8);
        direcLight.position.set(5, 12, 8);
        direcLight.castShadow = true;
        direcLight.shadow.mapSize.width = 2048;
        direcLight.shadow.mapSize.height = 2048;
        scene.add(direcLight);

        const fillLight = new THREE.DirectionalLight(0x88bbff, 0.3);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/kloppenheim_02_puresky_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

        // VIDEO
        const video = document.createElement('video');
        video.src = 'https://watcharapong1451.github.io/portclip_compressed.mp4';
        video.crossOrigin = 'anonymous';
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.play().catch(e => console.log('Video autoplay blocked:', e));

        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.format = THREE.RGBAFormat;
        videoTexture.flipY = false;
        videoTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        // SHADER MATERIAL 
        const uniforms = {
            uTime: { value: 0.0 },
            uLightDir: { value: new THREE.Vector3(0.4, 1.0, 0.8).normalize() },
        };
        
        function Decoranimation(originalMaterial) {
            const baseColor = (originalMaterial && originalMaterial.color) ? originalMaterial.color : new THREE.Color(0xffffff);
            const hasMap = (originalMaterial && originalMaterial.map) ? 1.0 : 0.0;
            const texture = (originalMaterial && originalMaterial.map) ? originalMaterial.map : new THREE.Texture();

            const vertexShader = `
                uniform float uTime;
                varying vec3 vNormal, vPosW;
                varying vec2 vUv;

                void main() {
                    vUv = uv;
                    vNormal = normalMatrix * normal;
                    vec3 pos = position;
                    pos.z += sin(pos.x * 5.0 + uTime * 2.0) * 0.1;

                    vPosW = (modelMatrix * vec4(pos, 1.0)).xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `;

            const fragmentShader = `
                precision mediump float;
                uniform vec3 uLightDir;
                uniform sampler2D uTexture;
                uniform vec3 uColor;
                uniform float uHasMap;
                varying vec3 vNormal, vPosW;
                varying vec2 vUv;

                void main() {
                    vec3 N = normalize(vNormal), L = normalize(uLightDir);

                    float diffuse = floor(max(dot(N, L), 0.0) * 5.0) / 5.0;
                    float spec = smoothstep(0.4, 0.6, pow(max(dot(reflect(-L, N), normalize(cameraPosition - vPosW)), 0.0), 16.0));

                    vec3 color = (uHasMap > 0.5) ? texture2D(uTexture, vUv).rgb * uColor : uColor;

                    gl_FragColor = vec4(color * (diffuse + 0.4) + spec * 0.5, 1.0);  
                }
            `;
            
            return new THREE.ShaderMaterial({
                vertexShader,
                fragmentShader,
                uniforms: {
                    ...uniforms,
                    uTexture: { value: texture },
                    uColor: { value: baseColor },
                    uHasMap: { value: hasMap }
                },
                side: THREE.DoubleSide
            });
        }

        function coverscreenanimation(originalMaterial) {
            const baseColor = (originalMaterial && originalMaterial.color) ? originalMaterial.color : new THREE.Color(0xffffff);
            const hasMap = (originalMaterial && originalMaterial.map) ? 1.0 : 0.0;
            const texture = (originalMaterial && originalMaterial.map) ? originalMaterial.map : new THREE.Texture();

            const vertexShader = `
                uniform float uTime;
                varying vec3 vNormal, vPosW;
                varying vec2 vUv;

                void main() {
                    vUv = uv;
                    vNormal = normalMatrix * normal;

                    vec3 pos = position;
                    float wave = sin(pos.x * 3.5 + uTime * 2.5) * 0.06;
                    float wave2 = cos(pos.y * 2.5 + uTime * 2.0) * 0.04;
                    pos.z += wave + wave2;

                    vPosW = (modelMatrix * vec4(pos, 1.0)).xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `;

            const fragmentShader = `
                precision mediump float;
                uniform sampler2D uTexture;
                uniform vec3 uColor;
                uniform float uHasMap;
                varying vec2 vUv;
            
                void main() {
                    vec4 texColor = (uHasMap > 0.5) ? texture2D(uTexture, vUv) : vec4(1.0);
                    gl_FragColor = vec4(texColor.rgb * uColor, texColor.a);  
                }
            `;

            return new THREE.ShaderMaterial({
                vertexShader,
                fragmentShader,
                uniforms: {
                    ...uniforms,
                    uTexture: { value: texture },
                    uColor: { value: baseColor },
                    uHasMap: { value: hasMap }
                },
                side: THREE.DoubleSide
            });
        }

        function leafanimation(originalMaterial) {
            const baseColor = (originalMaterial && originalMaterial.color) ? originalMaterial.color : new THREE.Color(0xffffff);
            const hasMap = (originalMaterial && originalMaterial.map) ? 1.0 : 0.0;
            const texture = (originalMaterial && originalMaterial.map) ? originalMaterial.map : new THREE.Texture();

            const vertexShader = `
                uniform float uTime;
                varying vec3 vNormal, vPosW;
                varying vec2 vUv;

                void main() {
                    vUv = uv;
                    vNormal = normalMatrix * normal;

                    vec3 pos = position;
                    float wind = sin(uTime * 2.8 + pos.x * 4.0 + pos.z * 4.0) * 0.05 * max(0.0, pos.y);
                    pos.x += wind;
                    pos.z += wind * 0.6;

                    vPosW = (modelMatrix * vec4(pos, 1.0)).xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `;

            const fragmentShader = `
                precision mediump float;
                uniform vec3 uLightDir;
                uniform sampler2D uTexture;
                uniform vec3 uColor;
                uniform float uHasMap;
                varying vec3 vNormal, vPosW;
                varying vec2 vUv;

                void main() {
                    vec3 N = normalize(vNormal), L = normalize(uLightDir);

                    float diffuse = floor(max(dot(N, L), 0.0) * 5.0) / 5.0;
                    float spec = smoothstep(0.4, 0.6, pow(max(dot(reflect(-L, N), normalize(cameraPosition - vPosW)), 0.0), 16.0));

                    vec3 color = (uHasMap > 0.5) ? texture2D(uTexture, vUv).rgb * uColor : uColor;

                    gl_FragColor = vec4(color * (diffuse + 0.4) + spec * 0.5, 1.0);  
                }
            `;

            return new THREE.ShaderMaterial({
                vertexShader,
                fragmentShader,
                uniforms: {
                    ...uniforms,
                    uTexture: { value: texture },
                    uColor: { value: baseColor },
                    uHasMap: { value: hasMap }
                },
                side: THREE.DoubleSide
            });
        }

        // PICKING SYSTEM 
        const pickables = [];
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let picked_object = null;
        
        let pointerDownPos = { x: 0, y: 0 };
        
        renderer.domElement.addEventListener('pointerdown', (e) => {
            pointerDownPos = { x: e.clientX, y: e.clientY };
        });
        
        renderer.domElement.addEventListener('pointerup', onPick);
        
        function onPick(e) {
            const moveX = Math.abs(e.clientX - pointerDownPos.x);
            const moveY = Math.abs(e.clientY - pointerDownPos.y);
            if (moveX > 5 || moveY > 5) return;
        
            const r = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
            pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(pickables, true);
        
            // ถ้าคลิกพื้นหลัง ให้ซูมถอยกลับตำแหน่งเดิม
            if (intersects.length === 0) {
                picked_object = null;
                targetCamPos.copy(defaultCamPos);
                targetLookAt.copy(defaultLookAt);
                isLerping = true;
                return;
            }
        
            // เก็บวัตถุชิ้นแรกที่ยิงโดน และสั่งซูมกล้องเข้าหา
            picked_object = intersects[0].object;
            console.log('Picked object:', picked_object.name || picked_object);

            const worldPos = new THREE.Vector3();
            picked_object.getWorldPosition(worldPos);

            targetLookAt.copy(worldPos);
            targetCamPos.set(worldPos.x, worldPos.y + 1, worldPos.z + 3.5);
            isLerping = true;
        }

        const loader = new THREE.GLTFLoader();
        loader.load('https://watcharapong1451.github.io/Portfolio_3D.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;

                    if (child.name === 'Screen') {
                        child.material = new THREE.MeshBasicMaterial({
                            map: videoTexture
                        });
                    }
                    
                    if (child.name === 'Decor') {
                        child.material = Decoranimation(child.material);
                    }
                    if (child.name === 'coverscreen') {
                        child.material = coverscreenanimation(child.material);
                    }
                    if (child.name === 'leaf') {
                        child.material = leafanimation(child.material);
                    }

                    if (child.name === 'Plane016_3' || child.name === 'Decor' || child.name === 'Board_Port' || child.name === 'Screen') {
                        pickables.push(child);
                    }
                }
            });
            model.position.set(0, 0, 1);
            scene.add(model);
        });


        function animate(t) {
            requestAnimationFrame(animate);

            uniforms.uTime.value = t * 0.001;

            if (isLerping) {
                camera.position.lerp(targetCamPos, 0.05);
                controls.target.lerp(targetLookAt, 0.05);

                if (camera.position.distanceTo(targetCamPos) < 0.01 && controls.target.distanceTo(targetLookAt) < 0.01) {
                    isLerping = false;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate(0);

        // รีไซส์หน้าต่างและอัปเดตกล้องและเรนเดอร์
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
